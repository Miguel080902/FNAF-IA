<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Five Nights at Freddy's - Fan Web Port</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #frame {
      position: absolute; inset: 0; margin: auto;
      width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16));
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #hud { cursor: default; }
    #boot {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; color: #ddd; font: 18px/1.4 "Courier New", monospace; text-align: center; background: #000; padding: 16px;
    }
    #bar { width: min(420px, 80%); height: 10px; border: 1px solid #777; }
    #fill { height: 100%; width: 0; background: #ddd; }
    #start { display: none; font: inherit; color: #000; background: #ddd; border: 0; padding: 12px 28px; cursor: pointer; }
    #note { font-size: 13px; color: #888; max-width: 560px; }
  </style>
</head>
<body>
  <div id="frame">
    <canvas id="scene" width="1280" height="720"></canvas>
    <canvas id="hud" width="1280" height="720"></canvas>
    <div id="boot">
      <div id="msg">Cargando...</div>
      <div id="bar"><div id="fill"></div></div>
      <button id="start">JUGAR</button>
      <div id="note">Port web hecho por fans, sin afiliaci&oacute;n oficial. Five Nights at Freddy's &copy; Scott Cawthon.<br>
        Contiene sustos, destellos y sonidos fuertes. F: pantalla completa.</div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
